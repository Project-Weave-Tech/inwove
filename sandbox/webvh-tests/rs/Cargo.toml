[package]
name = "wpi-webvh-rs"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Test harness CLI around didwebvh-rs 0.8.2 (test keys only; nothing here is shipped)"

[[bin]]
name = "wpi-webvh-rs"
path = "src/main.rs"

[dependencies]
didwebvh-rs = "=0.8.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
chrono = "0.4"
reqwest = "0.13"
sha2 = "0.11"
base58 = "0.2"
