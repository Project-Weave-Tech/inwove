name: tsp-library-tests
# ref/09 (Railroad): TSP 1.0 between @openvtc/vti-tsp-js 0.4.0 and affinidi-tsp 0.3.0, tamper refusals, no network.
# TEST VALUES ONLY: every key and DID is generated inside a job and thrown away with it. No real person's key, no secret,
# no deploy, no outside mediator. Read-only by construction: no secrets, no environments, no id-token, no
# pull_request_target or workflow_run. Edits to this file always go to Faolan as a push card (never the standing merge).
# Built so far: audit, vectors, roundtrip, tamper, netwatch (roundtrip half), and `mediator` early wiring (Railroad
# 11681, Security 11742: line D both ways, line C + inbox mode, Z1/Z2/Z3, R1, open and closed default). Not built yet,
# and the report says so as not passed: the full mediator line (steps 3-8, the endpoint-DID half of C), netwatch's
# mediator half. A missing result is a failure, never a skip.
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/wpi-build-tsp-**'
permissions:
  contents: read
env:
  WPI_DIR: sandbox/tsp-tests
jobs:
  audit:
    name: audit (npm audit, cargo audit, licences, pins)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sandbox/tsp-tests
      - run: rustup update stable --no-self-update && rustc --version
      - name: pins and licences (full shas recorded; fails the job at its end if a pin moved)
        id: pins
        continue-on-error: true
        env:
          WPI_JOB: audit
        run: node "$WPI_DIR/check-pins.mjs" results
      - name: install cargo-audit (pinned)
        run: cargo install cargo-audit --locked --version =0.23.0
      - run: node "$WPI_DIR/audit.mjs" results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: results-audit
          path: results
          retention-days: 14
      - name: fail if a pin moved
        if: always() && steps.pins.outcome == 'failure'
        run: echo "a pin moved or a licence changed (see the pins step); update pins.json on purpose" && exit 1

  vectors:
    name: vectors (spec Appendix A through TS and Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SPEC_REPO: https://github.com/trustoverip/tswg-tsp-specification
      SPEC_SHA: ccda6b33159d860f05c328eb436dabe83548b705
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sandbox/tsp-tests
      - run: rustup update stable --no-self-update && rustc --version
      - name: build the Rust peer (affinidi-tsp 0.3.0, locked)
        run: cargo build --locked --release --manifest-path "$WPI_DIR/rs/Cargo.toml"
      - name: the spec at the pinned commit (fails if that exact commit can't be fetched)
        run: |
          git init -q "$RUNNER_TEMP/spec"
          git -C "$RUNNER_TEMP/spec" fetch -q --depth 1 "$SPEC_REPO" "$SPEC_SHA"
          git -C "$RUNNER_TEMP/spec" checkout -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/spec" rev-parse HEAD)" = "$SPEC_SHA"
          echo "spec at $(git -C "$RUNNER_TEMP/spec" rev-parse HEAD)"
      - name: vectors
        id: vectors
        continue-on-error: true
        run: node "$WPI_DIR/vectors.mjs" results "$RUNNER_TEMP/spec/spec/spec.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: results-vectors
          path: results
          retention-days: 14
      - name: fail if a vector failed
        if: always() && steps.vectors.outcome == 'failure'
        run: echo "a vector failed (see the vectors step)" && exit 1

  roundtrip:
    name: roundtrip (TS and Rust both ways, binding envelope, relationship) and tamper
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sandbox/tsp-tests
      - run: rustup update stable --no-self-update && rustc --version
      - name: build the Rust peer (affinidi-tsp 0.3.0, locked)
        run: cargo build --locked --release --manifest-path "$WPI_DIR/rs/Cargo.toml"
      - name: roundtrip
        id: roundtrip
        continue-on-error: true
        run: node "$WPI_DIR/roundtrip.mjs" results
      - name: tamper (on the roundtrip frames)
        id: tamper
        continue-on-error: true
        run: node "$WPI_DIR/tamper.mjs" results
      - name: netwatch (roundtrip again inside a network namespace with no network)
        id: netwatch
        continue-on-error: true
        run: sudo unshare -n -- sudo -u "$USER" env PATH="$PATH" HOME="$HOME" node "$WPI_DIR/netwatch.mjs" results
      - name: the report (this job's lines; the report job is the one that goes red while a line is missing)
        if: always()
        run: node "$WPI_DIR/report.mjs" results "$RUNNER_TEMP/report.md" > /dev/null || true; cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: drop the throwaway test keys before upload
        if: always()
        run: rm -f results/frames.json results/offline/frames.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: results-roundtrip
          path: results
          retention-days: 14
      - name: fail if any step failed
        if: always() && (steps.roundtrip.outcome == 'failure' || steps.tamper.outcome == 'failure' || steps.netwatch.outcome == 'failure')
        run: echo "roundtrip ${{ steps.roundtrip.outcome }}, tamper ${{ steps.tamper.outcome }}, netwatch ${{ steps.netwatch.outcome }}" && exit 1

  mediator:
    name: mediator early wiring (lean build; line D both ways; line C, Z1/Z2/Z3, R1 with open and closed default)
    # Railroad 11681 + Security 11742. The mediator at the pin, built here; the upstream TEST-ONLY conf
    # (docker/test/conf, its secrets.json is committed upstream as test-only); Redis by digest. Every other key is
    # made by the scripts and dies with them. The scripts print statuses and problem codes, never a key or password.
    # Its results go in their own artifact (not results-*): the report's `mediator` line stays NOT BUILT until
    # steps 3-8 land. The closed-default run is expected red while admin calls ride TSP (check_admin_signature
    # needs did#fragment); that stays a fail in the record, never a skip.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MED_REPO: https://github.com/affinidi/affinidi-messaging-mediator
      MED_SHA: 34bbdea4717e3a8dd1fdb190ad9c2ad2b33a3316
      MED_FEATURES: didcomm,tsp,redis-backend,jemalloc
      REDIS_IMAGE: redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
      OUT: results/mediator-early
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sandbox/tsp-tests
      - name: packages the mediator build needs (the host Dockerfile's list)
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libdbus-1-dev clang cmake
      - name: the mediator at the pinned commit (fails if that exact commit can't be fetched)
        run: |
          git init -q "$RUNNER_TEMP/med"
          git -C "$RUNNER_TEMP/med" fetch -q --depth 1 "$MED_REPO" "$MED_SHA"
          git -C "$RUNNER_TEMP/med" checkout -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/med" rev-parse HEAD)" = "$MED_SHA"
          echo "mediator at $(git -C "$RUNNER_TEMP/med" rev-parse HEAD)"
          grep -q '^local_direct_delivery_allowed = ' "$RUNNER_TEMP/med/docker/test/conf/mediator.toml"
      - name: build the mediator (locked, the lean feature set, no `vta`)
        # Railroad 11973: the running mediator never holds the admin key, so the build has no `vta` (no boot-time
        # admin-credential load, no `rotate-admin`). The set is recorded in L8 beside the pin and the conf hash; a move
        # back to `vta` or any `secrets-*` feature is a fresh Security read.
        working-directory: ${{ runner.temp }}/med
        run: cargo build --locked --release -p affinidi-messaging-mediator --no-default-features --features "$MED_FEATURES" 2>&1 | tail -n 40; exit ${PIPESTATUS[0]}
      - name: the lean build has no rotate-admin (16.4; the binary must run, the subcommand must not exist)
        id: lean
        continue-on-error: true
        run: |
          bin="$RUNNER_TEMP/med/target/release/mediator"; mkdir -p "$OUT"
          # The binary itself answers --help, so a missing or broken binary can't pass this as "rotate-admin failed".
          # Actions runs bash with -e, so each exit code is caught with || rather than read after the fact.
          help=0; timeout 20 "$bin" --help > "$RUNNER_TEMP/help.txt" 2>&1 || help=$?
          # No subcommand list at all in a build without `vta` (the help's prose still names rotate-admin, so not grep'd).
          if grep -q '^Commands:' "$RUNNER_TEMP/help.txt"; then cmds=present; else cmds=absent; fi
          ra=0; timeout 20 "$bin" rotate-admin --help > /dev/null 2>&1 || ra=$?
          printf '{"features":"%s","help_exit":%d,"commands_section":"%s","rotate_admin_help_exit":%d}\n' "$MED_FEATURES" "$help" "$cmds" "$ra" > "$OUT/lean-build.json"
          cat "$OUT/lean-build.json"
          # Pass = --help exits 0, no Commands section, rotate-admin --help exits non-zero and not by timeout (124).
          test "$help" -eq 0 && test "$cmds" = absent && test "$ra" -ne 0 && test "$ra" -ne 124
      - name: Redis by digest (fails if the digest doesn't match)
        run: |
          docker pull -q "$REDIS_IMAGE"
          docker image inspect --format '{{join .RepoDigests " "}}' "$REDIS_IMAGE" | grep -q "${REDIS_IMAGE#*@}"
          mkdir -p "$OUT"
      - name: line D both ways (marker password; counts only)
        id: lined
        continue-on-error: true
        run: bash "$WPI_DIR/mediator-line-d.sh" "$RUNNER_TEMP/med/target/release/mediator" "$RUNNER_TEMP/med/docker/test/conf" "$WPI_DIR/redis-docker.sh" "$OUT/line-d.json"
      - name: line C, Z1/Z2/Z3, R1, line A (explicit-deny default)
        id: aclopen
        continue-on-error: true
        run: node "$WPI_DIR/mediator-acl.mjs" "$RUNNER_TEMP/med/target/release/mediator" "$RUNNER_TEMP/med/docker/test/conf" "$WPI_DIR/redis-docker.sh" "$OUT/acl-open.json"
      - name: the same with --closed-default (expected red while admin calls ride TSP)
        id: aclclosed
        continue-on-error: true
        run: node "$WPI_DIR/mediator-acl.mjs" "$RUNNER_TEMP/med/target/release/mediator" "$RUNNER_TEMP/med/docker/test/conf" "$WPI_DIR/redis-docker.sh" "$OUT/acl-closed.json" --closed-default
      - name: summary (statuses and problem codes only)
        if: always()
        run: |
          { echo "## mediator early wiring @ $MED_SHA"; echo; for f in "$OUT"/*.json; do [ -f "$f" ] || continue; echo "### $(basename "$f")"; echo '```json'; cat "$f"; echo '```'; done; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mediator-early
          path: results/mediator-early
          retention-days: 30
      - name: fail if any step failed
        if: always() && (steps.lean.outcome == 'failure' || steps.lined.outcome == 'failure' || steps.aclopen.outcome == 'failure' || steps.aclclosed.outcome == 'failure')
        run: echo "lean build ${{ steps.lean.outcome }}, line D ${{ steps.lined.outcome }}, acl open ${{ steps.aclopen.outcome }}, acl closed ${{ steps.aclclosed.outcome }}" && exit 1

  report:
    name: report (one markdown report; fails while a line is missing)
    needs: [audit, vectors, roundtrip]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: results
          pattern: results-*
      - run: node "$WPI_DIR/report.mjs" results report.md > /dev/null; s=$?; cat report.md >> "$GITHUB_STEP_SUMMARY"; exit $s
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: report
          path: report.md
          retention-days: 30
