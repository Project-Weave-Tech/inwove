name: verify-setup-token-dead
# Run AFTER the setup token has been deleted in Railway. Calls the API with the old token; scripts/token-verdict.sh
# reads the answer. Railway refuses a token with HTTP 200, data null and "Not Authorized" (not 401; Security, bus 17720).
# DEAD exits 0; ALIVE (projects came back) or UNCLEAR fails the run. The body never reaches the log.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: railway-setup
    steps:
      - uses: actions/checkout@v4
      - name: The old setup token must be refused
        env:
          RAILWAY_SETUP_TOKEN: ${{ secrets.RAILWAY_SETUP_TOKEN }}
        run: |
          set +x
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::main only"; exit 1; fi
          [ -n "$RAILWAY_SETUP_TOKEN" ] || { echo "::error::the secret is gone from GitHub, so this cannot prove the token is dead in Railway; re-add the old value or check by hand"; exit 1; }
          body=$(mktemp "$RUNNER_TEMP/r.XXXXXX")
          chmod 600 "$body"
          trap 'rm -f "$body"' EXIT
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 30 -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer ${RAILWAY_SETUP_TOKEN}" -H 'Content-Type: application/json' --data '{"query":"query { projects { edges { node { id } } } }"}') || code="000"
          if bash scripts/token-verdict.sh "$code" "$body"; then exit 0; fi
          echo "::error::not proven dead: see the line above (ALIVE = delete the setup token in Railway now; UNCLEAR = route to Security)"
          exit 1
